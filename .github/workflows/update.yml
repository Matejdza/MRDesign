name: Osvezi brojeve i objavi stranicu

on:
  schedule:
    - cron: "17 * * * *"   # svakog sata
  workflow_dispatch:        # rucno pokretanje iz kartice Actions
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instaliraj biblioteke
        run: pip install -r requirements.txt

      - name: Procitaj tabelu i izracunaj brojeve
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: |
          if [ -z "$GOOGLE_SERVICE_ACCOUNT_JSON" ] || [ -z "$SHEET_ID" ]; then
            echo "::warning::Secrets jos nisu podeseni, objavljujem poslednje sacuvane brojeve."
          else
            python scripts/update_stats.py
          fi

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
